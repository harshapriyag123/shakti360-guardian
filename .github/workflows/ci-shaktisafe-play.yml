name: Verify ShaktiSafe Play
on:
  push:
    paths:
      - 'rote/shaktisafe-brief/**'
      - '.github/workflows/ci-shaktisafe-play.yml'
  pull_request:
    paths:
      - 'rote/shaktisafe-brief/**'
      - '.github/workflows/ci-shaktisafe-play.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rote/shaktisafe-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v
      - run: python3 demo.py
